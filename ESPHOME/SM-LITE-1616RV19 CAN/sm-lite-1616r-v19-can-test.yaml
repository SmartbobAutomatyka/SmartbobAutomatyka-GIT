script:
  # Wysylamy tylko, gdy plytka jest online - nie nadajemy w pusta/odpieta magistrale
  # (bez ACK ESP32 wpada w bus-off)
  - id: send_leds
    mode: queued
    then:
      - if:
          condition:
            binary_sensor.is_on: board_online
          then:
            - canbus.send:
                canbus_id: can_bus
                can_id: 0x100
                data: !lambda |-
                  uint32_t c = id(tx_counter)++;
                  uint8_t bits = (id(led1).state ? 0x01 : 0) | (id(led2).state ? 0x02 : 0);
                  return std::vector<uint8_t>{
                    (uint8_t) c, (uint8_t)(c >> 8), (uint8_t)(c >> 16), (uint8_t)(c >> 24),
                    0x00, bits, 0x5A, 0xA5 };

interval:
  # Plytka gasi LEDy po 12 s bez ramki - odswiezamy co 5 s
  - interval: 5s
    then:
      - script.execute: send_leds
  - interval: 1s
    then:
      - lambda: |-
          // Plytka nadaje co max 5 s - po 12 s ciszy uznajemy ja za offline.
          // Wejscia (i przekazniki) zostaja w ostatnim stanie, zeby przerwa
          // w komunikacji nie przelaczala przekaznikow.
          if (id(board_online).state && millis() - id(last_rx_ms) > 12000) {
            id(board_online).publish_state(false);
          }

          twai_status_info_t s;
          if (twai_get_status_info(&s) != ESP_OK) return;

          // Stan: 0 STOPPED, 1 RUNNING, 2 BUS_OFF, 3 RECOVERING
          static uint32_t last_log = 0;
          if (millis() - last_log > 10000) {
            last_log = millis();
            ESP_LOGD("can", "stan %d, TEC %u, REC %u, kolejka TX %u",
                     (int) s.state, (unsigned) s.tx_error_counter,
                     (unsigned) s.rx_error_counter, (unsigned) s.msgs_to_tx);
          }

          // ESPHome sam wychodzi z bus-off; pomagamy dopiero, gdy stoi dluzej niz 5 s
          static uint32_t bad_since = 0;
          if (s.state == TWAI_STATE_RUNNING) {
            bad_since = 0;
          } else if (bad_since == 0) {
            bad_since = millis();
          }
          bool stuck = bad_since != 0 && millis() - bad_since > 5000;
          if (stuck && s.state == TWAI_STATE_BUS_OFF) {
            ESP_LOGW("can", "bus-off - odzyskiwanie");
            twai_initiate_recovery();
          } else if (stuck && s.state == TWAI_STATE_STOPPED) {
            ESP_LOGW("can", "kontroler zatrzymany - start");
            twai_start();
          } else if (stuck && s.state == TWAI_STATE_RECOVERING) {
            // Errata ESP32: odzyskiwanie konczy sie dopiero przy TEC = 0 i REC = 0,
            // a REC potrafi urosnac juz po wejsciu w bus-off -> utyka na zawsze.
            // Jak CONFIG_TWAI_ERRATA_FIX_BUS_OFF_REC: wymuszamy ponowny bus-off (TEC 0 -> 255),
            // co zeruje REC; sterownik i ESPHome odzyskuja od nowa.
            static uint32_t last_kick = 0;
            if (millis() - last_kick > 5000) {
              last_kick = millis();
              ESP_LOGW("can", "odzyskiwanie utknelo (TEC %u, REC %u) - wymuszam ponowny bus-off",
                       (unsigned) s.tx_error_counter, (unsigned) s.rx_error_counter);
              volatile uint32_t *twai = (volatile uint32_t *) 0x3FF6B000;  // rejestry TWAI w ESP32
              twai[0x00 / 4] |= 1;      // MODE: tryb reset (TEC zapisywalny tylko w nim)
              twai[0x3C / 4] = 0;       // TEC = 0
              twai[0x3C / 4] = 255;     // TEC = 255 -> bus-off, REC = 0
            }
          }

          // Plytka byla online, a od 30 s brak ramek mimo pracy kontrolera ->
          // stop/start kontrolera (sterownik zostaje zainstalowany).
          // UWAGA: nie wolno wolac id(can_bus)->setup() - esp32_can liczy kontrolery
          // statycznym licznikiem i drugie wywolanie oznacza canbus jako FAILED.
          static uint32_t last_kick_run = 0;
          if (s.state == TWAI_STATE_RUNNING && id(last_rx_ms) != 0 &&
              millis() - id(last_rx_ms) > 30000 && millis() - last_kick_run > 30000) {
            last_kick_run = millis();
            ESP_LOGW("can", "brak ramek 30 s - stop/start kontrolera CAN (TEC %u, REC %u)",
                     (unsigned) s.tx_error_counter, (unsigned) s.rx_error_counter);
            twai_stop();
            twai_start();
          }


# WEB SERWER / SERWER WWW
web_server:
  port: 80
  id: com_web_server

# TEXT / USTAWIENIA TEXT
text_sensor:
  - platform: template
    name: "ESP32-M03 Uptime"
    id: uptime_human
    icon: mdi:clock-start
  - platform: template
    name: "IP"
    id: ip_address
    entity_category: diagnostic
    icon: "mdi:ip-network"
    #lambda: return { id(eth).get_ip_address().str() };
    lambda: |-
      char buf[40];
      id(eth).get_ip_addresses()[0].str_to(buf);
      return {std::string(buf)};
    update_interval: 10s

# FONT / CZCIONKI
font:
  - file: "gfonts://Roboto"
    id: text_font
    size: 12

  - file: "gfonts://Material+Symbols+Outlined"
    id: icons
    size: 15
    glyphs: [
      "\U0000eb2f", # lan
      "\U0000e875", # server
      "\U0000e8b5", # clock
      "\U0000e1ff" # thermometer
    ]

  - file: "gfonts://Material+Symbols+Outlined"
    id: icons_big
    size: 30
    glyphs: [
      "\U0000e1ff" # thermometer
    ]

display:
  - platform: ssd1306_i2c
    i2c_id: com_i2c_bus_a
    model: "SSD1306_128X64"
    id: oled_display
    pages:
      - id: page1
        lambda: |-
          it.printf(32, 5, id(text_font), "SMARTBOB");
          it.printf(27, 22, id(text_font), "AUTOMATYKA");
          it.printf(5, 39, id(text_font), "WWW.SMARTBOB.PL");
      - id: page2
        lambda: |-
          int seconds = round(id(upt_time_text).state);
          int days = seconds / (24 * 3600);
          seconds = seconds % (24 * 3600);
          int hours = seconds / 3600;
          it.print(0, 0, id(icons), TextAlign::LEFT, "\U0000eb2f");
          it.printf(18, 1,id(text_font), "%s", id(ip_address).state.c_str());
          it.print(0, 16, id(icons), TextAlign::LEFT, "\U0000e8b5");
          it.printf(18,17,id(text_font),"%d dni, %02d godzin",days,hours);
          it.print(0, 32, id(icons), TextAlign::LEFT, "\U0000e875");
          it.printf(18, 33, id(text_font), "SM-LITE-1616R");
          it.print(0, 48, id(icons), TextAlign::LEFT, "\U0000e1ff");
          it.printf(18, 49, id(text_font), "%.1f°, %.1f°", id(sensor_pcb_temp_1).state, id(sensor_pcb_temp_2).state);
      - id: page3
        lambda: |-
          it.printf(33, 5, id(text_font), "OVERHEAT");
          it.print(50, 20, id(icons_big), TextAlign::LEFT, "\U0000e1ff");
          it.printf(33, 52, id(text_font), "%.1f°, %.1f°", id(sensor_pcb_temp_1).state, id(sensor_pcb_temp_2).state);
