  # EXT ADC INPUT 2 / KANAŁ POMIARU NAPIĘCIA 2
  - platform: adc
    pin: GPIO34
    id: sensor_adc_ext_2
    attenuation: 12db
    name: "ADC 2"
    samples: 32
    sampling_mode: avg
    update_interval: 1s
    unit_of_measurement: "V"
    device_class: "voltage"
    accuracy_decimals: 3
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - offset: -0.142
      - calibrate_linear:
          - 0.011 -> 1.3
          - 0.085 -> 2
          - 0.403 -> 5
          - 0.947 -> 10
          - 1.489 -> 15
          - 2.029 -> 20
          - 2.563 -> 25
          - 2.882 -> 28

