# NAME / NAZWA
substitutions:
  name: sm-lite-1616r-v19
  friendly_name: sm-lite-1616r-v19

# DATA
esphome:
  name: ${name}
  comment: ${friendly_name}
  project:
    name: "smartbob.sm-lite-1616r"
    version: "1.0.0"
  on_boot:
    then:
      - display.page.show: page1
      - delay: 7s
      - display.page.show: page2
  # ADD MAC NUMBER TO NAME / DODAWANIE ADRESU MAC DO NAZWY
  name_add_mac_suffix: false

# PROCESOR
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      # Obejscia bledow sprzetowych kontrolera CAN (TWAI) w ESP32
      CONFIG_TWAI_ERRATA_FIX_BUS_OFF_REC: y
      CONFIG_TWAI_ERRATA_FIX_TX_INTR_LOST: y
      CONFIG_TWAI_ERRATA_FIX_RX_FRAME_INVALID: y
      CONFIG_TWAI_ERRATA_FIX_RX_FIFO_CORRUPT: y
      CONFIG_TWAI_ERRATA_FIX_LISTEN_ONLY_DOM: y

globals:
  - id: last_rx_ms
    type: uint32_t
    initial_value: '0'
  - id: tx_counter
    type: uint32_t
    initial_value: '0'
  - id: can_node
    type: uint8_t
    initial_value: '0'      # 0 = przyjmij pierwsza plytke, ktora sie odezwie

# LOGING LEVEL / LOGOWANIE
logger:
  level: DEBUG

# 1WIRE
one_wire:
  - platform: gpio
    id: com_one_wire
    pin: GPIO32

# CAN
# Ramka plytki CAN V1: ID 0x100 + node, 8 bajtow:
#   0..3 licznik, 4 node, 5 wejscia, 6..7 = 0x5A 0xA5
# Bity wejsc wg opisu na PCB:
#   bit0 = PCB IN6, bit1 = PCB IN1, bit2 = PCB IN2,
#   bit3 = PCB IN3, bit4 = PCB IN5, bit5 = PCB IN4
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO33     # -> TXD/CTX transceivera
    rx_pin: GPIO39     # <- RXD/CRX transceivera
    can_id: 0x100
    bit_rate: 125KBPS
    on_frame:
      - can_id: 0x100
        can_id_mask: 0x700      # przyjmuje 0x100..0x1FF
        use_extended_id: false
        then:
          - lambda: |-
              if (x.size() != 8 || x[6] != 0x5A || x[7] != 0xA5) return;
              uint8_t node = x[4];
              ESP_LOGD("can", "ID 0x%03X node %u wejscia 0x%02X", can_id, node, x[5]);
              if (node == 0) return;                        // ramka nie z plytki CAN V1
              if (id(can_node) == 0) id(can_node) = node;   // przywiaz sie do pierwszej plytki
              if (node != id(can_node)) return;             // inne plytki ignorujemy
              uint8_t in = x[5];
              id(in1).publish_state(in & 0x02);   // PB0
              id(in2).publish_state(in & 0x04);   // PB1
              id(in3).publish_state(in & 0x08);   // PB3
              id(in4).publish_state(in & 0x20);   // PB5
              id(in5).publish_state(in & 0x10);   // PB4
              id(in6).publish_state(in & 0x01);   // PA2
              if (id(node_id).state != node) id(node_id).publish_state(node);
              id(last_rx_ms) = millis();
              if (!id(board_online).state) id(board_online).publish_state(true);

# UART-RS485
uart:
  - id: rs485_uart
    rx_pin: 13
    tx_pin: 4
    baud_rate: 9600
    stop_bits: 1
    data_bits: 8
    parity: NONE
    debug:
      direction: BOTH

modbus:
  - id: modbus1
    uart_id: rs485_uart
    flow_control_pin:
      number: GPIO2

modbus_controller:
  - id: modbus_device_1
    address: 0x01
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 3s

  - id: modbus_device_2
    address: 0x02
    modbus_id: modbus1
    setup_priority: -9
    update_interval: 3s

  - id: modbus_device_3
    address: 0x03
    modbus_id: modbus1
    setup_priority: -9
    update_interval: 3s

  - id: modbus_device_4
    address: 0x04
    modbus_id: modbus1
    setup_priority: -9
    update_interval: 3s

